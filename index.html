<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>State-Driven To-Do List</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <main class="todo-container" role="main">
        <h1>Task Manager</h1>
        
        <form id="todo-form">
            <label for="todo-input" class="visually-hidden">New task description</label>
            <input type="text" id="todo-input" placeholder="What needs to be done?" required aria-required="true">
            <button type="submit" class="btn-add">Add Task</button>
        </form>

        <div class="filter-group" role="toolbar" aria-label="Task filters">
            <button class="filter-btn active" data-filter="all">All</button>
            <button class="filter-btn" data-filter="active">Active</button>
            <button class="filter-btn" data-filter="completed">Completed</button>
        </div>

        <ul id="todo-list" aria-label="Task list"></ul>

        <div class="todo-footer">
            <span id="items-count">0 items left</span>
            <button id="clear-completed">Clear Completed</button>
        </div>
    </main>

    <script src="app.js"></script>
</body>
</html>
